# motionEye application settings. Authentication hashes live only on the Pi.
conf_path /etc/motioneye
run_path /run/motioneye
log_path /var/log/motioneye
media_path /var/lib/motion
log_level info
listen 127.0.0.1
port 8765
motion_binary /usr/bin/motion
motion_control_localhost true
motion_control_port 7999
motion_check_interval 10
motion_restart_on_errors true
cleanup_interval 3600
mjpg_client_timeout 10
mjpg_client_idle_timeout 10
smb_shares false
enable_reboot false
add_remove_cameras false
